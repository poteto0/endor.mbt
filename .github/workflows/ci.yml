name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# a new push to the same branch supersedes the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up the MoonBit toolchain
        uses: ./.github/actions/setup

      # every step below mirrors a `just ci-check` recipe, so the same checks
      # can be reproduced locally with a single command
      - name: Format check
        run: just fmt-check

      - name: Type check
        run: just check

      - name: Build (js)
        run: just build

      - name: Unit tests
        run: just ut-cov

      - name: Interface (.mbti) check
        run: just info-check
