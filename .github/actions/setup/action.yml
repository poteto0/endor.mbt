name: Set up the MoonBit toolchain
description: Installs Node.js, MoonBit and just, then syncs dependencies.

runs:
  using: composite
  steps:
    # `moon test --target js` runs the generated JS under node
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Set up MoonBit
      shell: bash
      run: |
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
        echo "$HOME/.moon/bin" >> $GITHUB_PATH

    - name: Set up just
      shell: bash
      run: |
        curl -fsSL https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Show toolchain versions
      shell: bash
      run: |
        moon version --all
        just --version

    - name: Sync dependencies
      shell: bash
      run: moon update
